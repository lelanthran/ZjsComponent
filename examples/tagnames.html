<!--
   Demonstrate how to create ones own custom element tagnames. The remote src
   'components/newtag.zjs' expect to use the global variable `newTag` to
   dispatch a message from an onclick handler.
-->
<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Tagname Test</title>

      <link href="css/default.css" rel="stylesheet">

      <script src="../zjs-component.js"></script>
      <script>
         window["newTag"] = ZjsComponent.register("new-tag", "components/newtag.zjsc");
      </script>
   </head>
   <body>
      <h1>Hello, world!</h1>
      <new-tag
         name='first-test-instance'
         display=block
         attr-1='value for test 1'>
      </new-tag>
      <new-tag
         name='second-test-instance'
         id='id-2'
         display=block
         attr-1='value for test 2'>
      </new-tag>
      <new-tag
         name='third-test-instance'
         display=block
         attr-1='value for test 3'>
      </new-tag>
   </body>
</html>
